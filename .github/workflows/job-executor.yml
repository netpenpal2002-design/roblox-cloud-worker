name: Roblox Job Executor

on:
  workflow_dispatch:

jobs:
  execute-job:
    runs-on: windows-11-arm

    steps:
      - name: Checkout job specification
        uses: actions/checkout@v4

      - name: Show worker environment
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "ROBLOX JOB EXECUTOR V1"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "OS:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "CPU CORES:"
          (Get-CimInstance Win32_Processor).NumberOfCores

          Write-Host ""
          Write-Host "RAM (GB):"
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          [math]::Round($ram / 1GB, 2)

      - name: Download Luau
        shell: pwsh
        run: |
          $url = "https://github.com/luau-lang/luau/releases/latest/download/luau-windows.zip"
          $zip = "$env:RUNNER_TEMP\luau.zip"
          $dir = "$env:RUNNER_TEMP\luau"

          Write-Host "Downloading Luau..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Write-Host "Extracting Luau..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          $luau = Get-ChildItem `
            $dir `
            -Filter "luau.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $luau) {
              throw "luau.exe was not found"
          }

          Write-Host "Luau executable:"
          Write-Host $luau.FullName

      - name: Read job specification
        shell: pwsh
        run: |
          $jobPath = "$env:GITHUB_WORKSPACE\jobs\job.json"

          if (-not (Test-Path $jobPath)) {
              throw "Job specification not found: $jobPath"
          }

          $job = Get-Content `
            -Raw `
            $jobPath |
            ConvertFrom-Json

          Write-Host "JOB ID:"
          Write-Host $job.job_id

          Write-Host ""
          Write-Host "JOB TYPE:"
          Write-Host $job.job_type

          Write-Host ""
          Write-Host "TITLE:"
          Write-Host $job.title

          Write-Host ""
          Write-Host "DESCRIPTION:"
          Write-Host $job.description

          Write-Host ""
          Write-Host "REQUIREMENTS:"
          $job.requirements | ForEach-Object {
              Write-Host " - $_"
          }

          if ($job.job_type -ne "module_script") {
              throw "Unsupported job_type: $($job.job_type)"
          }

      - name: Prepare workspace
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\job-output"

          if (Test-Path $output) {
              Remove-Item `
                $output `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $output `
            -Force |
            Out-Null

          Write-Host "Job workspace created:"
          Write-Host $output

      - name: Generate InventoryModule
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\job-output\InventoryModule.lua"

          $module = @'
          -- Roblox Inventory Module
          -- Generated by Roblox Job Executor V1

          local Inventory = {}
          Inventory.__index = Inventory

          function Inventory.new()
              local self = setmetatable({}, Inventory)
              self._items = {}
              return self
          end

          function Inventory:AddItem(itemName, quantity)
              assert(type(itemName) == "string", "itemName must be a string")
              assert(#itemName > 0, "itemName must not be empty")

              quantity = quantity or 1

              assert(type(quantity) == "number", "quantity must be a number")
              assert(quantity > 0, "quantity must be greater than zero")

              self._items[itemName] = (self._items[itemName] or 0) + quantity

              return self._items[itemName]
          end

          function Inventory:RemoveItem(itemName, quantity)
              assert(type(itemName) == "string", "itemName must be a string")

              quantity = quantity or 1

              assert(type(quantity) == "number", "quantity must be a number")
              assert(quantity > 0, "quantity must be greater than zero")

              local current = self._items[itemName]

              if not current then
                  return false
              end

              if quantity >= current then
                  self._items[itemName] = nil
                  return true
              end

              self._items[itemName] = current - quantity
              return true
          end

          function Inventory:HasItem(itemName)
              return self._items[itemName] ~= nil
          end

          function Inventory:GetQuantity(itemName)
              return self._items[itemName] or 0
          end

          function Inventory:Clear()
              self._items = {}
          end

          function Inventory:GetItems()
              local copy = {}

              for itemName, quantity in pairs(self._items) do
                  copy[itemName] = quantity
              end

              return copy
          end

          return Inventory
          '@

          [System.IO.File]::WriteAllText(
              $output,
              $module,
              (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Generated:"
          Write-Host $output

          Write-Host ""
          Get-Content $output

      - name: Generate validation tests
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\job-output\validation.luau"

          $tests = @'
          local Inventory = require("./InventoryModule")

          local inventory = Inventory.new()

          -- Add item
          assert(inventory:AddItem("Sword", 2) == 2)
          assert(inventory:GetQuantity("Sword") == 2)

          -- Add more of the same item
          assert(inventory:AddItem("Sword", 3) == 5)
          assert(inventory:GetQuantity("Sword") == 5)

          -- Check existing item
          assert(inventory:HasItem("Sword") == true)

          -- Check missing item
          assert(inventory:HasItem("Shield") == false)
          assert(inventory:GetQuantity("Shield") == 0)

          -- Remove part of item quantity
          assert(inventory:RemoveItem("Sword", 2) == true)
          assert(inventory:GetQuantity("Sword") == 3)

          -- Remove final quantity
          assert(inventory:RemoveItem("Sword", 3) == true)
          assert(inventory:HasItem("Sword") == false)
          assert(inventory:GetQuantity("Sword") == 0)

          -- Add multiple item types
          inventory:AddItem("Potion", 5)
          inventory:AddItem("Shield", 1)

          local items = inventory:GetItems()

          assert(items.Potion == 5)
          assert(items.Shield == 1)

          -- Verify returned table is a copy
          items.Potion = 999
          assert(inventory:GetQuantity("Potion") == 5)

          -- Clear inventory
          inventory:Clear()

          assert(inventory:HasItem("Potion") == false)
          assert(inventory:HasItem("Shield") == false)
          assert(inventory:GetQuantity("Potion") == 0)

          print("ALL INVENTORY TESTS PASSED")
          '@

          [System.IO.File]::WriteAllText(
              $output,
              $tests,
              (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Validation tests created:"
          Write-Host $output

      - name: Generate README
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\job-output\README.md"

          $readme = @'
          # Roblox Inventory Module

          ## Description

          A reusable Roblox Luau ModuleScript for managing player inventory items.

          ## Features

          - Add items
          - Remove items
          - Check whether an item exists
          - Get item quantity
          - Clear inventory
          - Return a safe copy of inventory data

          ## Usage

          ```lua
          local Inventory = require(path.to.InventoryModule)

          local inventory = Inventory.new()

          inventory:AddItem("Sword", 1)

          print(inventory:HasItem("Sword"))
          print(inventory:GetQuantity("Sword"))

          inventory:RemoveItem("Sword", 1)
          ```

          ## Validation

          The included `validation.luau` script validates:

          - Adding items
          - Increasing quantities
          - Removing items
          - Removing the final quantity
          - Missing items
          - Multiple item types
          - Inventory copying
          - Clearing the inventory

          Generated by Roblox Job Executor V1.
          '@

          [System.IO.File]::WriteAllText(
              $output,
              $readme,
              (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "README generated."

      - name: Validate job deliverable
        shell: pwsh
        run: |
          $luau = Get-ChildItem `
            "$env:RUNNER_TEMP\luau" `
            -Filter "luau.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $luau) {
              throw "luau.exe was not found"
          }

          Push-Location "$env:GITHUB_WORKSPACE\job-output"

          try {
              Write-Host "Running acceptance tests..."
              Write-Host ""

              & $luau.FullName ".\validation.luau"

              if ($LASTEXITCODE -ne 0) {
                  throw "Validation failed with exit code $LASTEXITCODE"
              }

              Write-Host ""
              Write-Host "JOB VALIDATION PASSED"
          }
          finally {
              Pop-Location
          }

      - name: Verify deliverables
        shell: pwsh
        run: |
          $required = @(
              "InventoryModule.lua",
              "README.md",
              "validation.luau"
          )

          foreach ($file in $required) {
              $path = "$env:GITHUB_WORKSPACE\job-output\$file"

              if (-not (Test-Path $path)) {
                  throw "Missing deliverable: $file"
              }

              Write-Host "FOUND: $file"
          }

          Write-Host ""
          Write-Host "ALL DELIVERABLES VERIFIED"

      - name: Create deliverable ZIP
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\RobloxJob-job-001.zip"

          if (Test-Path $package) {
              Remove-Item $package -Force
          }

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\job-output\*" `
            -DestinationPath $package `
            -Force

          Write-Host "DELIVERABLE:"
          Write-Host $package

      - name: Upload job deliverable
        uses: actions/upload-artifact@v4
        with:
          name: RobloxJob-job-001
          path: RobloxJob-job-001.zip
          if-no-files-found: error

      - name: Job complete
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "ROBLOX JOB EXECUTOR V1 SUCCESS"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Job: job-001"
          Write-Host "Type: module_script"
          Write-Host "Deliverable: RobloxJob-job-001.zip"
          Write-Host "Validation: PASSED"
          Write-Host "Artifact: UPLOADED"name: Roblox Job Executor

