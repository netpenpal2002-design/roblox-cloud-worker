name: Windows RDP Login Test

on:
  workflow_dispatch:

jobs:
  rdp-test:
    runs-on: windows-11-arm

    steps:
      - name: Show Windows environment
        shell: pwsh
        run: |
          Write-Host "WINDOWS RUNNER ONLINE"
          Write-Host "Computer: $env:COMPUTERNAME"

          Write-Host "OS:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host "CPU CORES:"
          (Get-CimInstance Win32_Processor).NumberOfCores

          Write-Host "RAM (GB):"
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          [math]::Round($ram / 1GB, 2)

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Create temporary RDP user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "CREATING RDP USER"

          $existing = Get-LocalUser -Name "CloudWorker" -ErrorAction SilentlyContinue

          if ($existing) {
              Remove-LocalUser -Name "CloudWorker"
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "CloudWorker" `
            -Password $securePassword `
            -Description "Temporary RDP test user" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "CloudWorker"

          Write-Host "RDP USER CREATED"
          Write-Host "Username: CloudWorker"
          Write-Host "Password: stored in GitHub secret RDP_PASSWORD"

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Write-Host "ENABLING REMOTE DESKTOP"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service "TermService"

          Write-Host "RDP SERVICE:"
          Get-Service "TermService" |
            Select-Object Status, StartType, Name

          Write-Host "RDP PORT TEST:"
          Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389

      - name: Show Tailscale address
        shell: pwsh
        run: |
          Write-Host "TAILSCALE STATUS:"
          tailscale status

          Write-Host ""
          Write-Host "TAILSCALE IP:"
          tailscale ip

          Write-Host ""
          Write-Host "RDP PORT TEST:"
          Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP LOGIN INFORMATION"
          Write-Host "Username: CloudWorker"
          Write-Host "Password: GitHub secret RDP_PASSWORD"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "KEEPING RUNNER ALIVE FOR 15 MINUTES"
          Write-Host "CONNECT FROM YOUR LAPTOP NOW"
          Write-Host ""

          Start-Sleep -Seconds 900
