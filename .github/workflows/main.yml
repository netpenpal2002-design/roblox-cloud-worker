name: Windows Runner Test

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-11-arm

    steps:
      - name: Show Windows environment
        shell: pwsh
        run: |
          Write-Host "WINDOWS RUNNER ONLINE"
          Write-Host "Computer: $env:COMPUTERNAME"

          Write-Host "OS:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host "CPU CORES:"
          (Get-CimInstance Win32_Processor).NumberOfCores

          Write-Host "RAM (GB):"
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          [math]::Round($ram / 1GB, 2)

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Test Tailscale
        shell: pwsh
        run: |
          Write-Host "TAILSCALE STATUS:"
          tailscale status

          Write-Host ""
          Write-Host "TAILSCALE IP:"
          tailscale ip

          Write-Host ""
          Write-Host "PINGING PHONE:"
          tailscale ping 100.92.81.86

          Write-Host ""
          Write-Host "TAILSCALE TEST COMPLETE"
