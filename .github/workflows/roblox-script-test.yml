name: Roblox Script Production Test

on:
  workflow_dispatch:

jobs:
  roblox-script-test:
    runs-on: windows-11-arm

    steps:
      - name: Show Windows environment
        shell: pwsh
        run: |
          Write-Host "ROBLOX SCRIPT PRODUCTION TEST"
          Write-Host "Computer: $env:COMPUTERNAME"

          Write-Host "OS:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host "CPU CORES:"
          (Get-CimInstance Win32_Processor).NumberOfCores

          Write-Host "RAM (GB):"
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          [math]::Round($ram / 1GB, 2)

      - name: Download Luau
        shell: pwsh
        run: |
          $url = "https://github.com/luau-lang/luau/releases/latest/download/luau-windows.zip"
          $zip = "$env:RUNNER_TEMP\luau.zip"
          $dir = "$env:RUNNER_TEMP\luau"

          Write-Host "Downloading Luau..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          Write-Host "Extracting Luau..."
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $luau = Get-ChildItem `
            $dir `
            -Filter "luau.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $luau) {
              throw "luau.exe was not found"
          }

          Write-Host "Luau:"
          Write-Host $luau.FullName

      - name: Create Roblox ModuleScript
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\output" `
            -Force |
            Out-Null

          $module = @'
          -- Roblox Utility Module
          -- Generated by the Cloud Roblox Worker

          local Utility = {}

          function Utility.Clamp(value, minimum, maximum)
              assert(type(value) == "number", "value must be a number")
              assert(type(minimum) == "number", "minimum must be a number")
              assert(type(maximum) == "number", "maximum must be a number")

              return math.max(minimum, math.min(maximum, value))
          end

          function Utility.Lerp(a, b, alpha)
              assert(type(a) == "number", "a must be a number")
              assert(type(b) == "number", "b must be a number")
              assert(type(alpha) == "number", "alpha must be a number")

              return a + (b - a) * alpha
          end

          function Utility.IsValidPlayerName(name)
              return type(name) == "string"
                  and #name >= 1
                  and #name <= 20
          end

          return Utility
          '@

          $output = "$env:GITHUB_WORKSPACE\output\RobloxUtility.lua"

          [System.IO.File]::WriteAllText(
              $output,
              $module,
              (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Generated:"
          Write-Host $output

          Write-Host ""
          Get-Content $output

      - name: Create validation script
        shell: pwsh
        run: |
          $validation = @'
          local Utility = require("./RobloxUtility")

          assert(Utility.Clamp(15, 0, 10) == 10)
          assert(Utility.Clamp(-5, 0, 10) == 0)
          assert(Utility.Clamp(5, 0, 10) == 5)

          assert(Utility.Lerp(0, 10, 0.5) == 5)
          assert(Utility.Lerp(10, 20, 0.25) == 12.5)

          assert(Utility.IsValidPlayerName("Player") == true)
          assert(Utility.IsValidPlayerName("") == false)

          print("ROBLOX MODULE VALIDATION PASSED")
          '@

          $path = "$env:GITHUB_WORKSPACE\output\validate.luau"

          [System.IO.File]::WriteAllText(
              $path,
              $validation,
              (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Validate Roblox script
        shell: pwsh
        run: |
          $luau = Get-ChildItem `
            "$env:RUNNER_TEMP\luau" `
            -Filter "luau.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $luau) {
              throw "luau.exe was not found"
          }

          Push-Location "$env:GITHUB_WORKSPACE\output"

          try {
              Write-Host "Running Roblox module validation..."

              & $luau.FullName ".\validate.luau"

              if ($LASTEXITCODE -ne 0) {
                  throw "Luau validation failed with exit code $LASTEXITCODE"
              }
          }
          finally {
              Pop-Location
          }

      - name: Create deliverable package
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\RobloxUtility-deliverable.zip"

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\output\RobloxUtility.lua" `
            -DestinationPath $package `
            -Force

          Write-Host "DELIVERABLE CREATED:"
          Write-Host $package

      - name: Upload Roblox deliverable
        uses: actions/upload-artifact@v4
        with:
          name: RobloxUtility-deliverable
          path: RobloxUtility-deliverable.zip
          if-no-files-found: error

      - name: Production test complete
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "ROBLOX SCRIPT PRODUCTION TEST SUCCESS"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Deliverable: RobloxUtility-deliverable.zip"
