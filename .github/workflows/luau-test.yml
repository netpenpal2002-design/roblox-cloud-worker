name: Cloud Luau Test

on:
  workflow_dispatch:

jobs:
  luau-test:
    runs-on: windows-11-arm

    steps:
      - name: Show Windows environment
        shell: pwsh
        run: |
          Write-Host "CLOUD LUAU WORKER"
          Write-Host "Computer: $env:COMPUTERNAME"

          Write-Host "OS:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host "CPU CORES:"
          (Get-CimInstance Win32_Processor).NumberOfCores

          Write-Host "RAM (GB):"
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          [math]::Round($ram / 1GB, 2)

      - name: Download Luau
        shell: pwsh
        run: |
          $url = "https://github.com/luau-lang/luau/releases/latest/download/luau-windows.zip"
          $zip = "$env:RUNNER_TEMP\luau.zip"
          $dir = "$env:RUNNER_TEMP\luau"

          Write-Host "Downloading Luau..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          Write-Host "Extracting Luau..."
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          Write-Host "Luau files:"
          Get-ChildItem $dir -Recurse

      - name: Create Luau test
        shell: pwsh
        run: |
          $script = @'
          print("CLOUD LUAU WORKER TEST")
          print("2 + 3 =", 2 + 3)

          local function roblox_task(name)
              return "Completed: " .. name
          end

          print(roblox_task("Create Roblox script"))
          '@

          $path = "$env:RUNNER_TEMP\luau_test.luau"

          [System.IO.File]::WriteAllText(
              $path,
              $script,
              (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Test script:"
          Get-Content $path

      - name: Run Luau
        shell: pwsh
        run: |
          $luau = Get-ChildItem `
            "$env:RUNNER_TEMP\luau" `
            -Filter "luau.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $luau) {
              throw "luau.exe was not found"
          }

          Write-Host "Luau executable:"
          Write-Host $luau.FullName

          Write-Host ""
          Write-Host "Running Luau test..."

          & $luau.FullName "$env:RUNNER_TEMP\luau_test.luau"

          if ($LASTEXITCODE -ne 0) {
              throw "Luau exited with code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "LUAU TEST SUCCESS"
